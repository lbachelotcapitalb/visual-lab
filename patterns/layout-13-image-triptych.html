<!-- layout-13-image-triptych — trois images qui se lisent comme UNE bande. Ce n'est pas une
     galerie : une galerie donne à voir chaque image, une bande donne à voir un bloc. Ce qui
     fait la différence tient en trois règles, et elles se mesurent :
       • HAUTEUR COMMUNE — c'est ELLE qui fait la bande. Un pied et un sommet uniques, et l'œil
         lit un bloc même si les trois cellules n'ont pas le même ratio ;
       • gouttière CONSTANTE, et PETITE devant une cellule. Élargie, elle sépare au lieu de
         relier ;
       • la bande occupe sa largeur EXACTEMENT, d'un bord à l'autre — pas de reste à droite.
     Le « même ratio pour les trois » n'est PAS la loi : c'est ce qu'on obtient à poids égaux,
     un cas particulier. ref-07 y est (1/1/1, portrait 3:4, 42 % de sa carte, haut-droite) ;
     ref-08 n'y est pas (poids 1 / 1,31 / 1,14, hauteur imposée 380, pleine largeur, en pied)
     et se lit pourtant comme une seule bande. Les paramètres sont donc trois : la hauteur
     commune, les poids, et — quand la hauteur est laissée libre — le ratio qui la déduit.
     Couleurs via --vl-* uniquement (les images de démonstration sont génératives — aucune URL
     distante, rien qui périme). -->
<div class="vl-tri">

  <!-- A — une vague qui se lève, crête d'écume -->
  <figure class="vl-tri__cell">
    <svg viewBox="0 0 150 200" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A wave lifting into a foam crest">
      <defs>
        <linearGradient id="vltri-a" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" class="vl-tri-a-hi"/><stop offset="1" class="vl-tri-a-lo"/>
        </linearGradient>
        <filter id="vltri-soft"><feGaussianBlur stdDeviation="2"/></filter>
        <filter id="vltri-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter>
      </defs>
      <rect width="150" height="200" fill="url(#vltri-a)"/>
      <path d="M-10 128 C 30 96 62 82 96 92 C 128 101 142 124 160 140 L 160 210 L -10 210 Z"
            class="vl-tri-a-deep" opacity="0.55" filter="url(#vltri-soft)"/>
      <path d="M-10 120 C 26 90 58 74 94 84 C 122 92 138 112 160 128
               C 132 122 112 118 92 122 C 60 128 26 132 -10 140 Z"
            class="vl-tri-a-crest" opacity="0.9" filter="url(#vltri-soft)"/>
      <rect width="150" height="200" filter="url(#vltri-grain)" opacity="0.1"
            style="mix-blend-mode: overlay"/>
    </svg>
  </figure>

  <!-- B — parasol rouge planté dans le sable -->
  <figure class="vl-tri__cell">
    <svg viewBox="0 0 150 200" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A red beach parasol planted in the sand">
      <defs>
        <linearGradient id="vltri-b" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0" class="vl-tri-b-canvas"/><stop offset="1" class="vl-tri-b-canvas-lo"/>
        </linearGradient>
        <filter id="vltri-soft-b"><feGaussianBlur stdDeviation="1.6"/></filter>
        <filter id="vltri-grain-b"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter>
      </defs>
      <rect width="150" height="200" class="vl-tri-b-sky"/>
      <rect y="132" width="150" height="68" class="vl-tri-b-sand"/>
      <ellipse cx="86" cy="150" rx="46" ry="9" class="vl-tri-b-sand" opacity="0.55"
               filter="url(#vltri-soft-b)"/>
      <path d="M18 84 C 34 40 96 26 128 58 C 138 68 140 78 138 86 Z" fill="url(#vltri-b)"/>
      <rect x="84" y="82" width="4" height="66" class="vl-tri-b-pole"/>
      <rect width="150" height="200" filter="url(#vltri-grain-b)" opacity="0.1"
            style="mix-blend-mode: overlay"/>
    </svg>
  </figure>

  <!-- C — une dune, cadrage serré. Pas d'oyats dessinés : cinq brins vectoriels ne font pas
       une photo, ils font un pictogramme. -->
  <figure class="vl-tri__cell">
    <svg viewBox="0 0 150 200" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label="A dune ridge">
      <defs>
        <linearGradient id="vltri-c" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" class="vl-tri-c-hi"/><stop offset="1" class="vl-tri-c-lo"/>
        </linearGradient>
        <filter id="vltri-soft-c"><feGaussianBlur stdDeviation="2.4"/></filter>
        <filter id="vltri-grain-c"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter>
      </defs>
      <rect width="150" height="200" fill="url(#vltri-c)"/>
      <path d="M-10 104 C 28 78 64 92 96 78 C 120 68 138 72 160 64 L 160 210 L -10 210 Z"
            class="vl-tri-c-ridge" opacity="0.55" filter="url(#vltri-soft-c)"/>
      <path d="M-10 158 C 34 138 76 154 116 136 C 134 128 148 130 160 126 L 160 210 L -10 210 Z"
            class="vl-tri-b-sand" opacity="0.45" filter="url(#vltri-soft-c)"/>
      <path d="M-10 176 C 40 158 84 172 124 158 C 142 152 152 152 160 150 L 160 210 L -10 210 Z"
            class="vl-tri-c-ridge" opacity="0.7" filter="url(#vltri-soft-c)"/>
      <rect width="150" height="200" filter="url(#vltri-grain-c)" opacity="0.1"
            style="mix-blend-mode: overlay"/>
    </svg>
  </figure>

</div>

<style>
/* Les TROIS paramètres du pattern, et il n'y en a pas d'autres :
     --vl-tri-h      la hauteur COMMUNE de la bande. `auto` = laissée libre, elle se déduit
                     alors du ratio de la première cellule ; une valeur = elle est imposée,
                     et le ratio ne sert plus (ref-08 : 380px).
     --vl-tri-w1..3  les poids de largeur. ref-07 : 1 1 1. ref-08 : 1 / 1,31 / 1,14.
     --vl-tri-ratio  le ratio de la PREMIÈRE cellule, qui DÉDUIT la hauteur quand elle est
                     libre. À poids égaux les trois cellules l'héritent — c'est de là que
                     vient le « même ratio », qui est un COROLLAIRE et non la loi.
   Tout le reste — gouttière, rayon, clipping, hauteur commune — est la loi de la bande. */
.vl-tri {
  --vl-tri-h: auto;
  --vl-tri-ratio: 3 / 4;
  --vl-tri-w1: 1; --vl-tri-w2: 1; --vl-tri-w3: 1;

  width: 472px;
  height: var(--vl-tri-h);
  display: flex; align-items: stretch; gap: var(--vl-gap);
}

/* `flex: <poids> 0 0` et non `1 0 auto` : la base à 0 est ce qui fait que les poids commandent
   VRAIMENT la largeur. Avec une base auto, c'est le contenu qui décide et les poids ne font
   que se partager le reste — les cellules dérivent dès qu'une image a d'autres dimensions. */
.vl-tri__cell {
  margin: 0;
  position: relative;
  flex: 1 0 0;
  border-radius: var(--vl-radius-photo);
  overflow: hidden;
}
/* Le ratio ne vit que sur la PREMIÈRE cellule, et c'est ce qui généralise le pattern : il
   donne à la ligne flex sa taille transversale, et `align-items: stretch` la recopie sur les
   deux autres. Posé sur les trois — l'ancienne écriture — il leur imposait TROIS hauteurs
   différentes dès que les poids cessaient d'être égaux : la bande se disloquait, et rien ne
   pouvait la reparamétrer sans la casser. */
.vl-tri__cell:nth-child(1) { flex-grow: var(--vl-tri-w1); aspect-ratio: var(--vl-tri-ratio); }
.vl-tri__cell:nth-child(2) { flex-grow: var(--vl-tri-w2); }
.vl-tri__cell:nth-child(3) { flex-grow: var(--vl-tri-w3); }

/* `slice` : l'image REMPLIT la cellule et se fait recadrer. `meet` laisserait des bandes de
   fond dans les cellules et la bande cesserait d'être pleine. Le retrait du flux (`absolute`)
   n'est pas cosmétique : une image DANS le flux rend une hauteur intrinsèque à sa cellule,
   qui devient candidate à la taille de la ligne — la cellule la plus haute tirerait alors
   toute la bande, au lieu que ce soit le ratio de la première qui décide. */
.vl-tri__cell > svg,
.vl-tri__cell > img {
  display: block; position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}

/* Les arrêts de dégradé passent par des classes : une variable CSS dans un attribut de
   présentation SVG n'est pas garantie partout, une propriété CSS l'est. */
.vl-tri-a-hi { stop-color: var(--vl-ph-a-hi); }
.vl-tri-a-lo { stop-color: var(--vl-ph-a-lo); }
.vl-tri-a-deep { fill: var(--vl-ph-a-lo); }
.vl-tri-a-crest { fill: var(--vl-ph-a-crest); }
.vl-tri-b-sky { fill: var(--vl-ph-b-sky); }
.vl-tri-b-canvas { stop-color: var(--vl-ph-b-canvas); }
.vl-tri-b-canvas-lo { stop-color: var(--vl-ph-b-canvas-lo); }
.vl-tri-b-pole { fill: var(--vl-ph-b-pole); }
.vl-tri-b-sand { fill: var(--vl-ph-c-lo); }
.vl-tri-c-hi { stop-color: var(--vl-ph-c-hi); }
.vl-tri-c-lo { stop-color: var(--vl-ph-c-lo); }
.vl-tri-c-ridge { fill: var(--vl-ph-c-hi); }
</style>
