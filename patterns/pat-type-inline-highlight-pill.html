<!-- pat-type-inline-highlight-pill — fragment autonome. Couleurs via --vl-* uniquement. -->
<div style="padding:28px;border-radius:var(--vl-radius-sub);
     background:var(--vl-surface-dark);color:var(--vl-ink-invert);max-width:34ch">
  <p class="vl-hl-line">Expected 10x return</p>
  <p class="vl-hl-line"><span class="vl-hl">within 5 years.</span></p>
</div>

<style>
.vl-hl-line {
  margin: 0 0 14px;
  font-size: 24px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25;
}
.vl-hl-line:last-child { margin-bottom: 0; }
/* Le surlignage est une PILULE PLEINE inversée posée dans le flux, pas un fond de texte :
   le padding horizontal (12px) et le rayon complet sont ce qui l'empêche de ressembler
   à une erreur de rendu. Un seul fragment surligné par bloc. */
.vl-hl {
  display: inline-block;
  padding: 3px 12px; border-radius: 999px;
  background: var(--vl-surface-light); color: var(--vl-ink);
  font-weight: 500;
}
</style>
