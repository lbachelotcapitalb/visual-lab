<!-- tag-03-action-pill-bar — filtres et action principale sur une même ligne.
     Couleurs via --vl-* uniquement.

     LA HIÉRARCHIE NE PASSE NI PAR LA TAILLE NI PAR LA TYPO : toutes les pilules ont la même
     hauteur au pixel près. Ce qui désigne l'action de premier rang, c'est son REMPLISSAGE et
     sa POSITION — dernière de la ligne. Une pilule pleine posée en tête inverserait la
     lecture sans qu'aucune mesure de hauteur ne bouge, d'où le benchmark sur `lastElementChild`. -->
<div class="vl-actionbar">

  <span class="vl-actionbar__pill">
    <span class="vl-actionbar__well" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5.5" width="16" height="14" rx="2.6"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
    </span>
    <span class="vl-actionbar__stack">
      <span class="vl-actionbar__label">Date</span>
      <span class="vl-actionbar__value">28 Jan – 29 Jan 2026</span>
    </span>
    <svg class="vl-actionbar__caret" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1.5 6 6.5l5-5"/></svg>
  </span>

  <span class="vl-actionbar__pill">
    <span class="vl-actionbar__well" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
    </span>
    <span class="vl-actionbar__stack">
      <span class="vl-actionbar__value">Funnel</span>
    </span>
    <svg class="vl-actionbar__caret" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1.5 6 6.5l5-5"/></svg>
  </span>

  <span class="vl-actionbar__pill vl-actionbar__pill--solid">
    Export as CVS
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8.5 7H17v8.5"/></svg>
  </span>

</div>

<style>
.vl-actionbar {
  display: flex; align-items: center; gap: 12px;
  font-family: Montserrat, Poppins, Inter, "Helvetica Neue", Arial, sans-serif;
}
.vl-actionbar__pill {
  box-sizing: border-box;
  height: 62px; padding: 0 22px 0 8px;
  display: flex; align-items: center; gap: 14px;
  background: var(--vl-module);
  color: var(--vl-ink);
  border-radius: var(--vl-radius-pill, 999px);
}
/* Le puits : un disque PLUS CLAIR que la pilule qui le porte, à gouttière intérieure
   constante (son écart au bord gauche vaut son écart au bord haut). C'est exactement le
   motif de layout-05-nav-pill-bar, sur une tout autre référence — un motif de composition,
   pas une signature de charte. */
.vl-actionbar__well {
  flex: 0 0 auto;
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--vl-app);
  display: flex; align-items: center; justify-content: center;
}
.vl-actionbar__well svg { width: 19px; height: 19px; }
.vl-actionbar__stack { display: flex; flex-direction: column; justify-content: center; }
.vl-actionbar__label { font-size: 13px; line-height: 1.25; color: var(--vl-ink-soft); }
.vl-actionbar__value { font-size: 16px; line-height: 1.25; font-weight: 500; white-space: nowrap; }
.vl-actionbar__caret { width: 12px; height: 8px; margin-left: 4px; }
/* L'unique pilule pleine. Elle n'a PAS de puits : un puits en ferait un filtre déguisé, et
   la ligne perdrait la seule chose qui distingue une commande d'une portée. */
.vl-actionbar__pill--solid {
  background: var(--vl-invert); color: var(--vl-on-invert);
  padding: 0 26px; gap: 10px;
  font-size: 17px; font-weight: 500;
}
.vl-actionbar__pill--solid svg { width: 15px; height: 15px; }
</style>
