<style>
/* Un histogramme où UNE seule colonne est accentuée — la courante — et où l'info-bulle ne
   commente qu'elle. Ni axe, ni graduation, ni valeur sur les autres colonnes : la série donne
   une forme, l'accent donne le chiffre. Les colonnes sont arrondies EN HAUT ET EN BAS (elles
   flottent, elles ne sont pas plantées sur une ligne de base), et le pas est à peu près le
   double de la largeur de colonne — c'est ce vide qui rend l'accent lisible sans le grossir.
   L'info-bulle est ancrée à la colonne, pas à la carte : elle suit sa valeur quand elle change. */
.vl-callout {
  position: relative; width: 585px; height: 255px; padding: 26px 28px;
  display: flex; flex-direction: column;
  border-radius: var(--vl-radius-card);
  background-color: var(--vl-surface-glass);
  backdrop-filter: blur(var(--vl-blur));
  box-shadow: inset 0 1px 0 var(--vl-sheen);
  font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--vl-ink);
}
.vl-callout__head { display: flex; align-items: center; justify-content: space-between; }
.vl-callout__title { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.vl-callout__pill {
  display: inline-flex; align-items: center; padding: 7px 15px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
  background-color: var(--vl-surface-glass-strong);
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
.vl-callout__plot { flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 6px 0; }
.vl-callout__col { width: 56px; display: inline-flex; flex-direction: column; align-items: center; }
.vl-callout__bar {

  background-color: var(--vl-surface-glass-strong);
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
.vl-callout__col--on .vl-callout__bar {

  font-size: 11px; font-weight: 500;
}
</style>
