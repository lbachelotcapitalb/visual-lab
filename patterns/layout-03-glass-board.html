    <span class="vl-glass-board__stack">

  <div class="vl-glass-board__row">
    <div class="vl-glass-board__card"><span class="vl-glass-board__label">Expense statistic</span></div>

  <div class="vl-glass-board__card"><span class="vl-glass-board__label">Upcoming payments</span></div>

<style>
/* DEUX COUCHES, et pas une de plus. Couche 1 : un fond en DÉGRADÉ, qui accueille — c'est lui
   qui donne sa couleur à l'écran entier, et rien ne s'interpose entre lui et les modules.
   Couche 2 : les modules, rectangles de blanc translucide posés dessus, dont le flou
   d'arrière-plan reprend le dégradé en le brouillant. Un troisième panneau intermédiaire
   (une « planche » qui porterait les modules) est exactement ce qu'il ne faut pas : il divise
   par deux l'écart de blanc entre le fond et les modules, et toute la profondeur s'écrase.
   La hiérarchie ne tient ni à un trait ni à une couleur : elle tient au TAUX DE BLANC. À
   l'intérieur d'un module, un sous-bloc reprend la même règle un cran plus blanc, avec un
   rayon plus petit. Aucune bordure n'est dessinée : ce qui découpe une surface est un liseré
   de lumière, en haut seulement. La marge de fond est plus large que la gouttière — c'est ce
   liseré de dégradé qui fait lire les modules comme des objets posés, pas comme une grille. */
.vl-glass-board {
  position: relative; width: 1600px; height: 900px; padding: var(--vl-margin);
  display: flex; flex-direction: column; gap: var(--vl-gap);
  overflow: hidden;
  background-color: var(--vl-bg);
  background-image:
    radial-gradient(120% 90% at 12% 4%,  var(--vl-grad-2) 0%, transparent 58%),
    radial-gradient(100% 80% at 88% 96%, var(--vl-grad-3) 0%, transparent 62%),
    linear-gradient(148deg, var(--vl-grad-1) 0%, var(--vl-bg) 46%, var(--vl-grad-3) 100%);
  font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--vl-ink);
}
.vl-glass-board__card {
  flex: 1; padding: 24px 28px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  border-radius: var(--vl-radius-card);
  background-color: var(--vl-surface-glass);
  backdrop-filter: blur(var(--vl-blur));
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
.vl-glass-board__card--wide { flex: 0 0 276px; flex-direction: row; justify-content: space-between; }
.vl-glass-board__stack { display: flex; flex-direction: column; gap: 4px; }
.vl-glass-board__row { flex: 0 0 238px; display: flex; gap: var(--vl-gap); }
.vl-glass-board__label { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.vl-glass-board__fig { font-size: 44px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; }
.vl-glass-board__sub {
  padding: 8px 16px;
  border-radius: var(--vl-radius-sub);
  font-size: 12px; font-weight: 500;
  background-color: var(--vl-surface-glass-strong);
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
</style>
