<style>
/* La planche en verre dépoli. Le fond est un DÉGRADÉ, et deux halos flous lui donnent de la
   matière : sans rien derrière, un verre dépoli ne se voit pas. Trois densités de blanc
   s'emboîtent — planche 30 %, carte 45 %, sous-bloc 68 % — et le rayon décroît avec
   l'imbrication (40 → 28 → 18). La hiérarchie ne tient ni à un trait ni à une couleur : elle
   tient au TAUX DE BLANC et au flou d'arrière-plan. Aucune bordure n'est dessinée ; ce qui
   découpe une surface est un liseré de lumière (blanc à 45 %, en haut seulement). La marge de
   planche est plus large que la gouttière : c'est ce liseré de fond qui fait lire les cartes
