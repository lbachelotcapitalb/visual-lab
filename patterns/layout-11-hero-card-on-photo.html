<!-- layout-11-hero-card-on-photo — la coque d'un hero de page. Couleurs via --vl-* uniquement.

     DEUX couches, et pas une de plus : le SOL (photo pleine page) → la CARTE. Ce qui viendra
     dans la carte — nav, wordmark, images — ce sont des feuilles décorées, pas des couches.

     Le sol est une PHOTO, jamais un aplat. Une carte crème posée sur un aplat crème n'a plus
     de bord : le hero perd son sol et il ne reste qu'une marge. C'est la seule chose que ce
     pattern doit garantir, et c'est mesuré (écart de fond sol ↔ carte).

     `.vl-hcop__card` est VIDE : ce n'est pas un oubli, c'est le slot. Ce qui s'y posera sera
     ferré sur la marge intérieure de la carte — la seule promesse que la coque tienne à ce qui
     vient après elle (layout-12-nav-three-zone, title-03-wordmark-bottom-left,
     layout-13-image-triptych sur la référence). -->
<div class="vl-hcop">

  <!-- LE SOL — plage : ciel, mer, écume, sable mouillé, sable sec. Composition SVG
       générative : aucune URL distante, rien qui périme. Les lignes de houle sont espacées
       irrégulièrement — un peigne régulier redevient une trame géométrique et la mer meurt. -->
  <svg class="vl-hcop__ground" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"
       role="img" aria-label="A wide beach: sky, sea, wet sand and dry sand">
    <defs>
      <linearGradient id="vlhcop-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--vl-ground-sky-hi)"/>
        <stop offset="1" stop-color="var(--vl-ground-sky-lo)"/>
      </linearGradient>
      <linearGradient id="vlhcop-sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--vl-ground-sea-lo)"/>
        <stop offset="1" stop-color="var(--vl-ground-sea-hi)"/>
      </linearGradient>
      <linearGradient id="vlhcop-sand" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="var(--vl-ground-sand-wet)"/>
        <stop offset="0.45" stop-color="var(--vl-ground-sand-dry)"/>
        <stop offset="1" stop-color="var(--vl-ground-sand-wet)"/>
      </linearGradient>
      <filter id="vlhcop-haze"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="vlhcop-soft"><feGaussianBlur stdDeviation="3.5"/></filter>
      <filter id="vlhcop-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3"/>
      </filter>
    </defs>

    <rect width="1440" height="900" fill="url(#vlhcop-sky)"/>
    <ellipse cx="1060" cy="196" rx="300" ry="150" fill="var(--vl-ground-sun)"
             filter="url(#vlhcop-haze)" opacity="0.5"/>
    <rect y="330" width="1440" height="248" fill="url(#vlhcop-sea)"/>
    <g fill="var(--vl-ground-foam)" filter="url(#vlhcop-soft)" opacity="0.34">
      <rect y="352" width="1440" height="3"/><rect y="391" width="1440" height="5"/>
      <rect y="447" width="1440" height="3"/><rect y="512" width="1440" height="7"/>
    </g>
    <!-- l'écume : une bande irrégulière, pas un trait — c'est elle qui articule mer et sable -->
    <path d="M0 560 C 190 548 300 578 480 570 C 640 563 720 586 900 576
             C 1080 566 1210 590 1440 574 L 1440 604 C 1200 618 1060 596 900 604
             C 720 613 620 592 470 600 C 300 609 180 584 0 596 Z"
          fill="var(--vl-ground-foam)" filter="url(#vlhcop-soft)" opacity="0.85"/>
    <rect y="578" width="1440" height="322" fill="url(#vlhcop-sand)"/>
    <!-- laisses de marée : des arcs mous, jamais des courbes parallèles -->
    <g fill="var(--vl-ground-sand-wet)" filter="url(#vlhcop-soft)" opacity="0.35">
      <path d="M0 632 C 260 618 420 646 700 634 C 940 624 1150 648 1440 630 L 1440 640
               C 1150 660 940 636 700 646 C 420 658 260 630 0 644 Z"/>
      <path d="M0 726 C 300 706 520 742 820 726 C 1080 712 1240 740 1440 722 L 1440 733
               C 1240 752 1080 724 820 738 C 520 754 300 718 0 738 Z" opacity="0.7"/>
    </g>
    <rect width="1440" height="900" filter="url(#vlhcop-grain)" opacity="0.10"
          style="mix-blend-mode: overlay"/>
  </svg>

  <!-- LA CARTE — incrustée, jamais à fond perdu. Les marges de sol gauche et droite sont
       ÉGALES : c'est ce qui distingue une incrustation d'une carte poussée dans un coin. -->
  <div class="vl-hcop__card"><!-- slot : le contenu du hero --></div>

</div>

<style>
/* La scène est un HERO DE PAGE : 1440 × 900, ratio 1,6 — pas une slide, le 16:9 n'a pas de
   sens ici. `background` porte la dominante du ciel : c'est elle que lit le lint de
   composition, qui ne sait pas échantillonner un SVG. Sans elle, le sol se comparerait à du
   blanc et la carte crème passerait pour une couche 1:1 redondante. */
.vl-hcop {
  position: relative;
  width: 1440px; height: 900px;
  overflow: hidden;
  background: var(--vl-ground-sky-lo);
  display: flex; align-items: center; justify-content: center;
}
.vl-hcop__ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 78 % de la largeur de page. Le centrage par flex est ce qui rend les deux marges de sol
   égales PAR CONSTRUCTION — le pattern ne les pose pas à la main, il les fait découler de la
   taille de la carte. L'ombre est ce qui la fait flotter : sans elle, la carte redevient une
   découpe collée sur le fond. */
.vl-hcop__card {
  position: relative;
  width: 78.056%;   /* 1124 / 1440 */
  height: 74.222%;  /*  668 / 900  */
  padding: var(--vl-margin);
  background: var(--vl-card);
  border-radius: var(--vl-radius-card);
  box-shadow: var(--vl-shadow-card);
}
</style>
