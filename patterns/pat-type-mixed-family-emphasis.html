<!-- pat-type-mixed-family-emphasis — fragment autonome. Couleurs via --vl-* uniquement. -->
<h2 class="vl-mixed-emphasis">
  ego <em>(lite)</em> doesn't collect any data
</h2>

<style>
/* Emphase par CHANGEMENT DE FAMILLE, pas par couleur ni par taille.
   Le corps (font-size) reste identique : c'est le dessin de la lettre qui accentue. */
.vl-mixed-emphasis {
  margin: 0;
  font-family: var(--vl-font-display, -apple-system, "Helvetica Neue", Inter, sans-serif);
  font-size: var(--vl-size-title, 52px);
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -0.015em;
  color: var(--vl-ink);
}
.vl-mixed-emphasis em {
  font-family: var(--vl-font-accent, Georgia, "Times New Roman", serif);
  font-style: italic;
  font-weight: 400;
  /* Les serifs paraissent plus petits à corps égal : on compense sans changer la ligne. */
  font-size: 1.04em;
  letter-spacing: 0;
}
</style>
