<!-- layout-01-nested-bento — fragment autonome. Couleurs via --vl-* uniquement. -->
<section class="vl-bento">
  <div class="vl-bento__card vl-bento__card--light">
    <h2 class="vl-bento__title">Our<br>Highlights</h2>
    <p class="vl-bento__body">Niveau 1 : la carte. Rayon 24, padding 36. Elle porte le titre
      et rien d'autre de structurant.</p>
  </div>

  <div class="vl-bento__card vl-bento__card--dark vl-bento__grid">
    <div class="vl-bento__tile" style="background:var(--vl-accent);color:var(--vl-ink)">
      <span class="vl-bento__figure">$2M</span>
      <span class="vl-bento__micro">ARR achieved<br>in 12 months</span>
    </div>
    <div class="vl-bento__tile" style="background:var(--vl-surface-tile);color:var(--vl-ink-invert)">
      <span class="vl-bento__figure">30,000+</span>
      <span class="vl-bento__micro">active users<br>worldwide</span>
    </div>
    <div class="vl-bento__tile" style="background:var(--vl-surface-tile);color:var(--vl-ink-invert)">
      <span class="vl-bento__micro">Niveau 3 : la tuile.<br>Rayon 16, padding 18.</span>
    </div>
    <div class="vl-bento__tile" style="background:var(--vl-accent);color:var(--vl-ink)">
      <span class="vl-bento__figure">87%</span>
      <span class="vl-bento__micro">Customer<br>retention rate</span>
    </div>
  </div>
</section>

<style>
/* Trois niveaux d'imbrication, et UNE seule règle qui les fait lire :
   le rayon DÉCROÎT à chaque niveau (24 → 20 → 16) et le padding aussi (36 → 24 → 18).
   C'est cette décroissance qui donne la profondeur — d'où l'absence totale de bordures,
   d'ombres et de séparateurs. Garder un rayon constant à tous les niveaux fait s'aplatir
   la composition ; l'augmenter vers l'intérieur la fait paraître bombée. */
.vl-bento { display: flex; gap: var(--vl-gap); align-items: stretch; min-height: 300px; }
.vl-bento__card { flex: 1; border-radius: var(--vl-radius-card); padding: 36px; }
.vl-bento__card--light { background: var(--vl-surface-light); color: var(--vl-ink); }
.vl-bento__card--dark { background: var(--vl-surface-dark); color: var(--vl-ink-invert); padding: 16px; }
.vl-bento__grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
.vl-bento__tile {
  border-radius: var(--vl-radius-tile); padding: 18px;
  display: flex; flex-direction: column; min-height: 120px;
}
.vl-bento__title { margin: 0; font-size: 44px; font-weight: 500; line-height: 1.06; letter-spacing: -0.02em; }
.vl-bento__body { margin: auto 0 0; font-size: 14px; line-height: 1.5; color: var(--vl-ink-muted); max-width: 36ch; }
.vl-bento__figure { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
/* Les libellés sont collés en BAS de chaque tuile : c'est ce qui les aligne entre elles
   quel que soit le nombre de lignes du chiffre au-dessus. */
.vl-bento__micro { margin-top: auto; font-size: 11px; line-height: 1.35; opacity: .78; }
</style>
