<!-- pat-chart-bars-stadium — fragment autonome. Couleurs via --vl-* uniquement. -->
<div style="padding:32px;border-radius:var(--vl-radius-card);
     background:var(--vl-surface-dark);color:var(--vl-ink-invert);display:inline-block">
  <div class="vl-bars">
    <div class="vl-bars__col"><span class="vl-bars__val">1.8M</span>
      <span class="vl-bars__bar" style="height:78px;background:var(--vl-surface-light)"></span></div>
    <div class="vl-bars__col"><span class="vl-bars__val">$2.5M</span>
      <span class="vl-bars__bar" style="height:108px;background:var(--vl-accent)"></span></div>
    <div class="vl-bars__col"><span class="vl-bars__val">$3.6M</span>
      <span class="vl-bars__bar" style="height:155px;background:var(--vl-accent-2)"></span></div>
    <div class="vl-bars__col"><span class="vl-bars__val">$4.4M</span>
      <span class="vl-bars__bar" style="height:190px;background:var(--vl-accent-3)"></span></div>
  </div>
  <div class="vl-bars__axis"><span>2025</span><span>2026</span><span>2027</span><span>2028</span></div>
</div>

<style>
.vl-bars { display: flex; align-items: flex-end; gap: 20px; }
.vl-bars__col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vl-bars__val { font-size: 13px; }
/* Le sommet est un DEMI-CERCLE COMPLET, pas un coin adouci : le rayon vaut la moitié de la
   largeur de barre (999px sature au bon endroit). Un rayon plus petit fait « bouton », et
   arrondir aussi le bas ferait flotter la barre au-dessus de sa ligne de base. */
.vl-bars__bar { width: 56px; border-radius: 999px 999px 0 0; }
/* Pas d'axe tracé : chaque légende est une pilule pleine, alignée sur la largeur de barre.
   Une ligne d'axe en plus ajouterait un trait pour rien. */
.vl-bars__axis { display: flex; gap: 20px; margin-top: 10px; }
.vl-bars__axis span {
  width: 56px; text-align: center; padding: 5px 0; border-radius: 999px;
  background: var(--vl-surface-tile); color: var(--vl-ink-invert-muted); font-size: 11px;
}
</style>
