<!-- shape-04-asterisk-mark — le marqueur de marque d'une charte qui n'a qu'un accent : un
     astérisque à SIX branches, trois traits qui se croisent à 60°, et rien d'autre. Un seul
     dessin, trois emplois — seul dans un carré noir, en fin de titre, en fin de phrase.

     CE QUI EN FAIT UN PATTERN plutôt qu'un glyphe : le marqueur est le placement d'accent le
     MOINS CHER de la charte. La règle de « neutre + un accent fluo » se mesure en surface — le
     jaune reste sous 12 % de la slide — et un astérisque de traits ouverts dépense un demi
     pour cent de ce budget tout en posant la couleur exactement au point de fixation. C'est
     pour ça qu'il peut tenir la couverture ET la clôture sans que la charte bascule.

     LA CORRECTION QUE CE PATTERN PORTE, et elle vaut pour toute la référence : **le jaune ne
     descend jamais sur le fond clair.** Mesuré, `#EAFF00` sur `#EFEFED` vaut **1,03:1** — les
     deux valeurs ont presque la même luminance, et un tracé de 5 px n'y survit pas : il ne
     reste qu'un écart de teinte, qui vibre à l'écran et disparaît en gris. Le marqueur prend
     donc L'ENCRE DE SON SOL : jaune sur le carré noir (17:1), encre sur le fond clair (16:1).
     Sa forme est son identité, pas sa couleur. Le benchmark l'impose aux trois emplois.

     Le dessin est défini UNE fois en `<symbol>` et posé trois fois en `<use>` : deux emplois
     qui divergeraient d'un degré cesseraient d'être le même marqueur, et aucune relecture ne
     le verrait. Les six branches et leur égalité de longueur se vérifient sur la forme PEINTE,
     par sondage au point — un `<line>` mal orienté garde des attributs parfaitement lisibles.

     Le rayon du carré est une CONSTANTE de charte (19 px), pas une fraction de sa boîte : les
     deux carrés ci-dessous n'ont pas la même taille et portent le même rayon. C'est ce qui les
     fait appartenir au même système au lieu d'être deux versions à l'échelle. -->
<div class="vl-am">

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="vl-am-glyph" viewBox="0 0 72 72">
      <!-- Trois traits, six branches, 60° d'écart. Les demi-longueurs sont ÉGALES : 32 sur la
           verticale, et √(27,7² + 16²) = 31,98 sur les deux diagonales. Aucun `stroke` ici —
           la couleur vient du CSS de l'emploi, c'est ce qui permet à un même dessin de prendre
           l'encre de son sol. -->
      <g fill="none" stroke-linecap="butt">
        <line x1="36" y1="4" x2="36" y2="68"/>
        <line x1="8.3" y1="20" x2="63.7" y2="52"/>
        <line x1="8.3" y1="52" x2="63.7" y2="20"/>
      </g>
    </symbol>
  </svg>

  <div class="vl-am__row">
    <div class="vl-am__box vl-am__box--lg">
      <svg class="vl-am__mark vl-am__mark--on-dark" viewBox="0 0 72 72" aria-hidden="true"><use href="#vl-am-glyph"/></svg>
    </div>
    <div class="vl-am__box vl-am__box--sm">
      <svg class="vl-am__mark vl-am__mark--on-dark" viewBox="0 0 72 72" aria-hidden="true"><use href="#vl-am-glyph"/></svg>
    </div>
  </div>

  <h3 class="vl-am__title">What we deliver<svg class="vl-am__mark vl-am__mark--inline" viewBox="0 0 72 72" aria-hidden="true"><use href="#vl-am-glyph"/></svg></h3>

  <p class="vl-am__body">Four weeks, three checkpoints, one handover — nothing invoiced before the second<svg class="vl-am__mark vl-am__mark--inline" viewBox="0 0 72 72" aria-hidden="true"><use href="#vl-am-glyph"/></svg></p>

</div>
