<style>
/* La SEULE carte colorée d'une planche par ailleurs en verre : c'est son aplat qui la met au
   premier rang, pas sa taille. Le KPI est empilé en haut-gauche (libellé → chiffre → cadrage
   temporel) et la courbe traverse toute la carte derrière lui, sans axe ni grille. Deux
   annotations seulement, aux DEUX bouts de ce qui est mesuré ; après le point d'arrivée le
   trait continue en blanc atténué — ce prolongement est du décor, et son atténuation dit
   exactement ça. Le chiffre ne se pose jamais sur la courbe : la pile occupe le quart
   supérieur gauche, la courbe part du quart inférieur gauche. */
.vl-metric {
  position: relative; width: 659px; height: 255px; padding: 26px 28px; overflow: hidden;
  border-radius: var(--vl-radius-card);
  color: var(--vl-ink-invert);
  background-color: var(--vl-blue);
  background-image: linear-gradient(128deg, var(--vl-blue) 0%, var(--vl-blue) 34%, var(--vl-blue-light) 100%);
  font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
.vl-metric__curve { position: absolute; inset: 0; width: 100%; height: 100%; }
.vl-metric__head { position: relative; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; }
.vl-metric__label { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.vl-metric__fig { margin-top: 12px; font-size: 32px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
.vl-metric__sub { margin-top: 5px; font-size: 11px; color: var(--vl-ink-invert-muted); }
.vl-metric__btn {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px;
  display: inline-flex; align-items: center; justify-content: center;
  background-color: var(--vl-surface-glass-soft);
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
.vl-metric__btn svg { width: 16px; height: 16px; }
.vl-metric__tag { position: absolute; z-index: 2; font-size: 11px; font-weight: 500; color: var(--vl-ink-invert); }

</style>
