<!-- pat-list-index-rules — sommaire à filets : libellé + explication à gauche, numéro à droite,
     un filet 1 px sous chaque entrée. Couleurs via --vl-* uniquement. -->
<div class="vl-idx">
  <div class="vl-idx__row">
    <div>
      <p class="vl-idx__label">Introduction</p>
      <p class="vl-idx__desc">Who we are, where we operate, and the position we hold in our
        segment today.</p>
    </div>
    <span class="vl-idx__no">01</span>
  </div>
  <div class="vl-idx__row">
    <div>
      <p class="vl-idx__label">Problem &amp; solution</p>
      <p class="vl-idx__desc">The cost operators carry today, and the part of it our product
        removes.</p>
    </div>
    <span class="vl-idx__no">02</span>
  </div>
  <div class="vl-idx__row">
    <div>
      <p class="vl-idx__label">Business model</p>
      <p class="vl-idx__desc">How revenue is earned, retained and expanded across the two
        channels.</p>
    </div>
    <span class="vl-idx__no">03</span>
  </div>
</div>

<style>
.vl-idx { display: flex; flex-direction: column; width: 700px; }
/* Le filet appartient à l'entrée qu'il SUIT : il est posé en `border-bottom` sur la ligne,
   jamais réparti par `space-between` sur la hauteur disponible — un filet éloigné de son
   entrée se lit comme un oubli de mise en page. */
.vl-idx__row {
  display: flex; align-items: flex-start; gap: 48px;
  padding: 30px 0; border-bottom: 1px solid var(--vl-hairline);
}
.vl-idx__row:first-child { padding-top: 0; }
.vl-idx__label {
  margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 0.01em;
  text-transform: uppercase; color: var(--vl-black);
}
.vl-idx__desc {
  margin: 10px 0 0; max-width: 44ch;
  font-size: 17px; line-height: 1.55; color: var(--vl-ink-muted);
}
/* Le numéro est aligné sur la PREMIÈRE ligne du libellé, pas centré sur l'entrée : c'est ce
   qui fait tenir la colonne de droite quand une explication passe de deux à trois lignes. */
.vl-idx__no {
  margin-left: auto; font-size: 24px; font-weight: 800; letter-spacing: 0.01em;
  color: var(--vl-black);
}
</style>
