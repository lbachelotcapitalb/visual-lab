<style>
/* ————— la capsule ————— */
/* Toute la géométrie dérive d'UNE longueur, --vl-cap-u (l'unité) ; les nombres qui suivent
   sont des RATIOS mesurés sur la référence, pas des pixels choisis. Ils sont solidaires :
   le cou n'est tangent que pour ce jeu-là (cercle 0.6u, calotte 0.5u, congé 0.28u,
   entraxe 1.2u). Changer l'un sans recalculer les autres rouvre le contour. */
.vl-cap {
  --u: var(--vl-cap-u, 91px);
  --sw: calc(var(--u) * 0.055);           /* trait unique : SVG et bordures partagent cette valeur */
  position: relative;
  display: inline-flex;
  align-items: center;
  height: calc(var(--u) * 1.255);          /* = diamètre extérieur du cercle */
  color: var(--vl-neon);
  box-sizing: border-box;
}
.vl-cap * { box-sizing: border-box; }

/* La tête porte le cercle, les DEUX congés concaves et la calotte gauche de la pilule —
   d'un seul trait. C'est la soudure qui fait la signature : jamais deux formes posées
   l'une à côté de l'autre. Largeur fixe (1.8275u) : le cou ne s'étire pas. */
.vl-cap__head {
  flex: none;
  width: calc(var(--u) * 1.8275);
  height: 100%;
}
.vl-cap__head svg,
.vl-cap__tail svg { display: block; width: 100%; height: 100%; overflow: visible; }
.vl-cap__head path,
.vl-cap__tail path {
  fill: none;
  stroke: currentColor;
  stroke-width: 0.055;                     /* en unités de viewBox = 0.055u, comme --sw */
}

/* Le corps de la pilule : seules les deux droites, en bordures. Elles prolongent EXACTEMENT
   les extrémités du tracé SVG (même y, même épaisseur) — c'est ce qui autorise la largeur
   variable sans jamais rouvrir le contour. */
.vl-cap__label {
  height: calc(var(--u) * 1.055);
  border-top: var(--sw) solid currentColor;
  border-bottom: var(--sw) solid currentColor;
  display: flex;
  align-items: center;
  padding: 0 calc(var(--u) * 0.3) 0 calc(var(--u) * 0.18);
  font-size: calc(var(--u) * 0.62);
  line-height: 1;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.005em;
  white-space: nowrap;
}

/* La calotte droite : un demi-stade, de largeur fixe elle aussi. */
.vl-cap__tail {
  flex: none;
  width: calc(var(--u) * 0.5275);
  height: calc(var(--u) * 1.055);
}

/* Le glyphe est POSÉ dans le cercle, il n'entre pas dans le flux : le centre du cercle est
   à (0.6275u, 0.6275u), soit exactement (H/2, H/2). */
.vl-cap__icon {
  position: absolute;
  left: calc(var(--u) * 0.3175);
  top: 50%;
  transform: translateY(-50%);
  width: calc(var(--u) * 0.62);
  height: calc(var(--u) * 0.62);
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  overflow: visible;
}

/* ————— la pile ————— */
/* Alignée à DROITE : c'est le bord droit qui tient la colonne, les têtes tombent en escalier
   selon la longueur du mot. Empilées, elles se calent sur leur bord DROIT : la longueur des mots dessine l'escalier. */
.vl-capstack {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: calc(var(--vl-cap-u, 91px) * 0.1);
}
</style>
