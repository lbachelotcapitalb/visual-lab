<!-- pat-tile-kpi — fragment autonome. Couleurs via --vl-* uniquement. -->
<div style="display:flex;gap:12px;padding:16px;border-radius:var(--vl-radius-card);
     background:var(--vl-surface-dark)">
  <div class="vl-kpi" style="background:var(--vl-accent);color:var(--vl-ink)">
    <span class="vl-kpi__figure">$2M</span>
    <span class="vl-kpi__label">ARR achieved<br>in 12 months</span>
  </div>

  <div class="vl-kpi" style="background:var(--vl-surface-tile);color:var(--vl-ink-invert)">
    <svg class="vl-kpi__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="9" cy="8" r="3.4"/><circle cx="17" cy="9" r="2.6"/>
      <path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5z"/>
      <path d="M16.2 13.6c2.9.2 5.3 2.2 5.3 5.4h-4.6c0-2-.3-3.8-.7-5.4z"/>
    </svg>
    <span class="vl-kpi__figure">30,000+</span>
    <span class="vl-kpi__label">active users<br>worldwide</span>
  </div>

  <div class="vl-kpi" style="background:var(--vl-surface-tile);color:var(--vl-ink-invert)">
    <svg class="vl-kpi__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><ellipse cx="12" cy="12" rx="4.2" ry="9"/>
    </svg>
    <span class="vl-kpi__label">Expanded into<br>5 international<br>markets</span>
  </div>
</div>

<style>
/* Trois zones fixes, dans cet ordre : icône (facultative, en haut), chiffre, libellé collé
   en bas. Le libellé en `margin-top:auto` est ce qui aligne les bas de tuiles entre elles
   même quand l'une n'a pas de chiffre — sans ça la rangée se désaligne dès qu'un contenu
   change de longueur. */
.vl-kpi {
  flex: 1; min-height: 150px;
  border-radius: var(--vl-radius-tile); padding: 18px;
  display: flex; flex-direction: column;
}
.vl-kpi__icon { width: 18px; height: 18px; display: block; margin-bottom: 14px; align-self: flex-start; }
.vl-kpi__figure { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.vl-kpi__label { margin-top: auto; font-size: 11px; line-height: 1.35; opacity: .78; }
</style>
