<style>
/* Carte de solde : en-tête léger (titre + navigation), puis un GRAND panneau menthe qui
   occupe la carte et porte une jauge « compteur » — arc noir = acquis, arc hachuré = reste
   à courir, avec un curseur lilas. Chiffre héros en bas-droit, tendance en bas-gauche. */
.vl-balance {
  width: 556px; height: 470px;
  background: var(--vl-surface-light); color: var(--vl-ink);
  border-radius: var(--vl-radius-card); padding: 30px;
  display: flex; flex-direction: column;
  font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
.vl-balance__head { display: flex; justify-content: space-between; align-items: center; }
.vl-balance__title { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.vl-balance__nav { display: flex; gap: 10px; }
.vl-balance__circ {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--vl-hairline);
  display: inline-flex; align-items: center; justify-content: center;
}
.vl-balance__circ svg { width: 14px; height: 14px; }
.vl-panel {
  margin-top: 22px; flex: 1; position: relative;
  background: var(--vl-mint); border-radius: var(--vl-radius-sub); padding: 24px; overflow: hidden;
}
.vl-panel__chip {
  width: 42px; height: 42px; border-radius: 50%; background: var(--vl-surface-light);
  display: inline-flex; align-items: center; justify-content: center;
}
.vl-panel__chip svg { width: 18px; height: 18px; }
.vl-gauge { position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); width: 300px; }
.vl-balance__stat { position: absolute; left: 24px; bottom: 22px; }
.vl-balance__pct { font-size: 17px; font-weight: 700; color: var(--vl-ink); }
.vl-balance__avg { font-size: 11px; font-weight: 500; color: var(--vl-ink-on-mint); margin-top: 2px; }
.vl-balance__big { position: absolute; right: 24px; bottom: 20px; font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--vl-ink); }
</style>
