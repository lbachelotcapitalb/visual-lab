<style>
/* Une liste d'échéances en QUATRE zones fixes — identité (pastille + nom + date), imminence,
   offre, montant — tenues par une grille commune : c'est l'alignement des colonnes qui rend
   la liste balayable, pas un filet. Aucune ligne de séparation ; une seule ligne porte un fond
   (le survol), et une seule porte la pilule d'imminence — deux « une seule » qui font que
   l'œil trouve l'urgent sans lire. Le montant est la seule colonne alignée à droite : c'est ce
   qui le rend comparable d'une ligne à l'autre. */
.vl-due {
  position: relative; width: 1266px; height: 272px; padding: 26px 28px;
  display: flex; flex-direction: column;
  border-radius: var(--vl-radius-card);
  background-color: var(--vl-surface-glass);
  backdrop-filter: blur(var(--vl-blur));
  box-shadow: inset 0 1px 0 var(--vl-sheen);
  font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--vl-ink);
}
.vl-due__head { display: flex; align-items: center; justify-content: space-between; }
.vl-due__title { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.vl-due__all {
  display: inline-flex; align-items: center; padding: 9px 18px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background-color: var(--vl-surface-dark); color: var(--vl-ink-invert);
}
.vl-due__list { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 -14px; }
.vl-due__row {
  display: grid; grid-template-columns: 360px 170px 1fr 120px;
  align-items: center; gap: 16px;
  padding: 12px 14px; border-radius: var(--vl-radius-sub);
}
.vl-due__row--on { background-color: var(--vl-surface-glass-strong); box-shadow: inset 0 1px 0 var(--vl-sheen); }
.vl-due__who { display: flex; align-items: center; gap: 13px; }
.vl-due__mark {
  width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background-color: var(--vl-surface-glass-strong);
  box-shadow: inset 0 1px 0 var(--vl-sheen);
}
.vl-due__mark svg { width: 16px; height: 16px; }
.vl-due__name { display: block; font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
.vl-due__date { display: block; margin-top: 2px; font-size: 11px; color: var(--vl-ink-muted); }
.vl-due__flag {
  display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
  background-color: var(--vl-blue); color: var(--vl-ink-invert);
}
.vl-due__plan { font-size: 13px; font-weight: 500; }
.vl-due__amount { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; text-align: right; }
</style>
