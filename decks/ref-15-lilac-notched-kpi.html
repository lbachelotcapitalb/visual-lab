<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ref-15 — bande de preuves chiffrées (lavande SaaS)</title>
<style>
@import url("../fonts/fonts.css");

/* ref-15-lilac-notched-kpi — reconstitution fidèle. La source est un CROP horizontal
   (≈ 813 × 297) : ni le titre de la section ni le reste de la page ne sont visibles. Ce qui
   est reconstruit est donc la BANDE seule, centrée sur une slide au format PPT (1600×900) —
   la lecture honnête de ce qu'on voit, et rien de plus (cf. SPEC-SOURCES.md § ref-15).
   Deux gestes portent tout : le double chanfrein sur la diagonale, et le fait qu'UNE SEULE
   vignette sur trois change de fond. */
:root {
  --vl-bg: #F4F4FB;
  --vl-card: #FCFBFF;
  --vl-white: #FFFFFF;
  --vl-violet: #6B3FE4;
  --vl-violet-light: #9A7BF0;
  --vl-figure: #4C1FD6;
  --vl-ink: #2E2166;
  --vl-ink-muted: #6E67A0;
  --vl-tile: #EBE7FB;
  --vl-tile-invert: rgba(255, 255, 255, 0.22);
  --vl-on-accent: #FFFFFF;
  --vl-on-accent-muted: #FFFFFF;
  --vl-notch: 46px;
  --vl-radius: 17px;
  --vl-margin: 120px;
  --vl-gutter: 43px;
  --vl-font: Montserrat, Poppins, Inter, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #55556A; font-family: var(--vl-font); }
.slide {
  position: relative;
  width: 1600px; height: 900px; margin: 0 auto;
  background: var(--vl-bg);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* La rangée : trois vignettes de largeur égale, gouttière unique = 0.102 × la largeur d'une
   vignette. C'est la seule mesure de la bande — rien d'autre ne s'écarte. */
.row { display: flex; gap: var(--vl-gutter); }

.vl-kpi {
  --vl-nc: var(--vl-notch);
  --vl-r: var(--vl-radius);
  width: 420px; height: 450px;
  padding: 38px 38px 34px;
  display: flex; flex-direction: column;
  background: var(--vl-card);
  color: var(--vl-ink);
  border-radius: var(--vl-r);
  clip-path: polygon(
    0 0,
    calc(100% - var(--vl-nc)) 0,
    100% var(--vl-nc),
    100% 100%,
    var(--vl-nc) 100%,
    0 calc(100% - var(--vl-nc))
  );
}
/* La SEULE vignette colorée de la rangée. Le dégradé monte du violet plein (coin bas-gauche,
   celui qui est chanfreiné) vers le lilas clair du coin haut-droit. `background-color` déclare
   l'extrémité CLAIRE : c'est le point le plus défavorable de la carte, et le seul que la
   mesure de contraste sait lire. */
.vl-kpi--accent {
  background-color: var(--vl-violet-light);
  background-image: linear-gradient(45deg, var(--vl-violet) 0%, var(--vl-violet) 18%, var(--vl-violet-light) 100%);
  color: var(--vl-on-accent);
}
.vl-kpi__tile {
  width: 79px; height: 79px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--vl-tile); color: var(--vl-violet);
}
.vl-kpi--accent .vl-kpi__tile { background: var(--vl-tile-invert); color: var(--vl-on-accent); }
.vl-kpi__tile svg { width: 38px; height: 38px; }
.vl-kpi__figure {
  margin: 26px 0 0;
  display: flex; align-items: baseline; gap: 4px;
  line-height: 1; color: var(--vl-figure);
}
.vl-kpi--accent .vl-kpi__figure { color: var(--vl-on-accent); }
.vl-kpi__num { font-size: 108px; font-weight: 800; letter-spacing: -0.03em; }
.vl-kpi__suffix { font-size: 46px; font-weight: 800; letter-spacing: -0.01em; }
.vl-kpi__label {
  margin: 12px 0 0;
  font-size: 34px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em;
}
.vl-kpi__note {
  margin: auto 0 0; align-self: flex-end; text-align: right;
  font-size: 20px; line-height: 1.45; font-weight: 500;
  color: var(--vl-ink-muted);
}
.vl-kpi--accent .vl-kpi__note { color: var(--vl-on-accent-muted); }
</style>
</head>
<body>

<section class="slide">
  <div class="row">

    <div class="vl-kpi">
      <span class="vl-kpi__tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.2"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="12" cy="12" r="1.1" fill="currentColor"/>
        </svg>
      </span>
      <p class="vl-kpi__figure"><span class="vl-kpi__num">99</span><span class="vl-kpi__suffix">%</span></p>
      <p class="vl-kpi__label">Data Accuracy</p>
      <p class="vl-kpi__note">Minimize errors,<br>maximize precision</p>
    </div>

    <div class="vl-kpi">
      <span class="vl-kpi__tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4.5H7.4A1.9 1.9 0 0 0 5.5 6.4v12.2a1.9 1.9 0 0 0 1.9 1.9h9.2a1.9 1.9 0 0 0 1.9-1.9V6.4a1.9 1.9 0 0 0-1.9-1.9H15"/>
          <rect x="9" y="2.9" width="6" height="3.2" rx="1.1"/>
          <path d="M9.2 13.6l1.9 1.9 3.7-3.9"/>
        </svg>
      </span>
      <p class="vl-kpi__figure"><span class="vl-kpi__num">40</span><span class="vl-kpi__suffix">%</span></p>
      <p class="vl-kpi__label">Less Manual Work</p>
      <p class="vl-kpi__note">Automate tasks and<br>focus on growth</p>
    </div>

    <div class="vl-kpi vl-kpi--accent">
      <span class="vl-kpi__tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.9 14.9 9 12a21 21 0 0 1 1.9-3.8A12.6 12.6 0 0 1 21.5 2.4c0 2.7-.8 7.3-5.9 10.8a21 21 0 0 1-3.7 1.7Z"/>
          <path d="M9 12H4.2s.5-3 2-3.9c1.6-1 4.9 0 4.9 0"/>
          <path d="M11.9 14.9v4.7s3-.5 3.9-2c1-1.6 0-4.9 0-4.9"/>
          <path d="M4.6 16.6c-1.5 1.2-2 4.9-2 4.9s3.7-.5 4.9-2c.7-.8.7-2.1-.1-2.8a2.1 2.1 0 0 0-2.8-.1Z"/>
        </svg>
      </span>
      <p class="vl-kpi__figure"><span class="vl-kpi__num">80</span><span class="vl-kpi__suffix">%</span></p>
      <p class="vl-kpi__label">Faster Reporting</p>
      <p class="vl-kpi__note">Generate reports<br>instantly with AI</p>
    </div>

  </div>
</section>

</body>
</html>
