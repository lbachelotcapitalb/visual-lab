<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ref-08 — swiss studio hero (Studioform®)</title>
<style>
/* sys-08 — reconstitution fidèle. ref-08 n'est PAS un deck : c'est UNE page web, cadrée
   carré comme la maquette source (1440×1440), la carte flottant sur la photo d'intérieur.
   Le conteneur porte quand même `.slide` pour que bin/slides.mjs et bin/board.mjs sachent
   l'exporter comme le reste du dépôt.

   Les trois photos du visuel d'origine sont remplacées par des compositions SVG génératives
   (marine / fenêtre / bouée) : aucune URL distante, rien à télécharger, rien qui périme —
   et elles portent les mêmes couleurs et le même cadrage que les photos qu'elles remplacent.
   Toutes les couleurs sont dans ce :root ; aucun hex plus bas. */
:root {
  /* — carte et encre — */
  --vl-bg: #C9BCA8;
  --vl-board: #C9BCA8;
  --vl-card: #F6F5F2;
  --vl-ink: #111111;
  --vl-ink-soft: #2A2A28;
  --vl-shadow: rgba(60, 44, 28, 0.30);
  --vl-shadow-near: rgba(60, 44, 28, 0.16);
  --vl-radius-card: 4px;
  --vl-radius-photo: 8px;
  --vl-margin: 40px;
  --vl-gap-photo: 16px;

  /* — la pièce derrière la carte : mur, rideau, lumière de fenêtre — */
  --vl-room-wall: #7E7565;
  --vl-room-wall-dark: #5C5548;
  --vl-room-warm: #E8DCC6;
  --vl-room-warm-hi: #F5EEDD;
  --vl-room-warm-lo: #C6B394;
  --vl-room-frame: #EFE7D6;
  --vl-room-frame-sh: #B8A587;
  --vl-room-glass: #DCDCD2;
  --vl-room-shade: rgba(60, 44, 28, 0.34);

  /* — photo A : marine, silhouette à capuche crème — */
  --vl-a-sky-hi: #C9D6DE;
  --vl-a-sky-lo: #9FB4C0;
  --vl-a-sea-hi: #7E97A6;
  --vl-a-sea-lo: #4E6675;
  --vl-a-cloth-hi: #F6F1E5;
  --vl-a-cloth: #EDE6D8;
  --vl-a-cloth-sh: #C3B8A3;
  --vl-a-cloth-deep: #A79C87;
  --vl-a-skin: #4A342A;
  --vl-a-glow-out: #6E8494;

  /* — photo B : fenêtre de cabine, deux passagères — */
  --vl-b-wall: #3A2E22;
  --vl-b-wall-hi: #6B5439;
  --vl-b-curtain-hi: #E8BC66;
  --vl-b-curtain-mid: #C08F34;
  --vl-b-curtain-lo: #8A6224;
  --vl-b-frame: #3B3226;
  --vl-b-frame-hi: #6A5B45;
  --vl-b-glass-edge: #F0EDE2;
  --vl-b-daylight: #F7EED8;
  --vl-b-out-hi: #DEE3E1;
  --vl-b-out-lo: #8FA0A1;
  --vl-b-hair: #E3C98E;
  --vl-b-coat: #C64B18;
  --vl-b-coat-hi: #E4703A;
  --vl-b-shirt: #D9BE79;
  --vl-b-shirt-hi: #F0DFAE;
  --vl-b-seat: #241B12;

  /* — photo C : eau verte, bouée — */
  --vl-c-water-hi: #9FB48A;
  --vl-c-water-mid: #7C9A6E;
  --vl-c-water-lo: #4E6B4C;
  --vl-c-bed: #6B8560;
  --vl-c-caustic: #E4EED6;
  --vl-c-ring-hi: #FCFAF3;
  --vl-c-ring: #F1EDE1;
  --vl-c-ring-sh: #BDB8A5;
  --vl-c-ring-accent: #E2622A;

  --vl-grain: rgba(255, 255, 255, 0.5);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--vl-board);
  font-family: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center;
}

/* ————— la page : cadrage carré de la maquette ————— */
.slide {
  position: relative;
  width: 1440px; height: 1440px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

/* ————— l'arrière-plan : intérieur chaud, fenêtre à droite, rideau —————
   Décoratif et hors flux de lecture (aria-hidden) : c'est une matière, pas un contenu.
   Le flou léger rejoue la profondeur de champ de la photo d'origine — sans lui, les
   aplats se lisent comme un dégradé CSS et la carte ne flotte plus sur rien. */
.room { position: absolute; inset: -40px; filter: blur(3px); }
.room__wall {
  position: absolute; inset: 0;
  background:
    linear-gradient(100deg,
      var(--vl-room-wall-dark) 0%,
      var(--vl-room-wall) 7%,
      var(--vl-room-warm-lo) 13%,
      var(--vl-room-warm) 26%,
      var(--vl-room-warm-hi) 46%,
      var(--vl-room-warm) 66%,
      var(--vl-room-warm-lo) 88%,
      var(--vl-room-wall) 100%);
}
/* plis du rideau : bandes verticales inégales, jamais un rythme régulier */
.room__folds {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, transparent 0 16%, var(--vl-room-shade) 17%, transparent 19% 25%,
      var(--vl-room-shade) 26%, transparent 28% 41%, var(--vl-room-shade) 42%,
      transparent 45% 63%, var(--vl-room-shade) 64%, transparent 67% 79%,
      var(--vl-room-shade) 80%, transparent 83% 100%);
  opacity: 0.5;
}
/* la fenêtre : montant vertical + traverse basse, en bas à droite */
.room__frame {
  position: absolute; right: 4%; bottom: 0; width: 46%; height: 62%;
  background: var(--vl-room-glass);
  box-shadow: inset 0 0 0 22px var(--vl-room-frame), inset 0 0 60px var(--vl-room-shade);
}
.room__mullion {
  position: absolute; right: 30%; bottom: 0; width: 20px; height: 62%;
  background: var(--vl-room-frame);
  box-shadow: -14px 0 24px var(--vl-room-shade);
}
.room__sill {
  position: absolute; right: 0; bottom: 7%; width: 56%; height: 26px;
  background: var(--vl-room-frame); box-shadow: 0 14px 26px var(--vl-room-shade);
}
.room__light {
  position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 62% 34%,
    var(--vl-room-warm-hi) 0%, transparent 58%);
  opacity: 0.75;
}
.room__vignette {
  position: absolute; inset: 0;
  background: radial-gradient(130% 110% at 50% 42%, transparent 42%, var(--vl-room-shade) 100%);
}

/* ————— la carte flottante ————— */
.card {
  position: relative;
  width: 1140px; height: 848px;
  padding: var(--vl-margin);
  background: var(--vl-card);
  color: var(--vl-ink);
  border-radius: var(--vl-radius-card);
  box-shadow: 0 6px 18px var(--vl-shadow-near), 0 46px 100px var(--vl-shadow);
  display: flex; flex-direction: column;
}

/* ————— haut de carte : la PHRASE d'abord, la nav à droite —————
   L'ordre de lecture est la signature de ce hero : le nom de marque ne vient qu'après.
   Les deux blocs partagent la même ligne de base haute — pas d'alignement optique bricolé. */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 64px; }
.statement {
  margin: 0; max-width: 700px;
  font-size: 27px; line-height: 1.4; font-weight: 400; letter-spacing: -0.004em;
  color: var(--vl-ink-soft);
}
.nav {
  display: flex; gap: 17px;
  margin: 5px 0 0;
  font-size: 18px; line-height: 1; font-weight: 400;
}
.nav a { color: var(--vl-ink); text-decoration: none; }

/* ————— le wordmark : il se règle à la LARGEUR, pas au nombre —————
   204px n'est pas une valeur de charte : c'est ce qu'il faut pour que « Studioform® »
   affleure les deux marges d'une carte de 1140. Changer la largeur de la carte oblige à
   recalculer (≈ largeur utile / 5.2 en Helvetica Bold à -0.035em). */
.wordmark {
  margin: 54px 0 0;
  font-size: 204px; line-height: 0.92; font-weight: 700;
  letter-spacing: -0.035em; white-space: nowrap;
}
/* Le ® n'est pas un caractère du mot : il est plus petit ET remonté en tête de capitale.
   Laissé à sa taille naturelle, il ferait une douzième lettre et casserait le bloc. */
.wordmark__r {
  font-size: 0.26em; vertical-align: baseline;
  position: relative; top: -1.52em; left: 0.02em;
  letter-spacing: 0;
}

/* ————— le triptyque : bas de carte, pleine largeur, largeurs INÉGALES ————— */
.strip {
  margin-top: auto;
  display: flex; gap: var(--vl-gap-photo);
  height: 380px;
}
.ph {
  display: block; height: 100%; width: 100%;
  border-radius: var(--vl-radius-photo);
  overflow: hidden;
}
.strip > :nth-child(1) { flex: 1 0 0; }
.strip > :nth-child(2) { flex: 1.31 0 0; }
.strip > :nth-child(3) { flex: 1.14 0 0; }
</style>
</head>
<body>

<section class="slide">

  <div class="room" aria-hidden="true">
    <div class="room__wall"></div>
    <div class="room__folds"></div>
    <div class="room__frame"></div>
    <div class="room__mullion"></div>
    <div class="room__sill"></div>
    <div class="room__light"></div>
    <div class="room__vignette"></div>
  </div>

  <div class="card">

    <div class="top">
      <p class="statement">We partner with startups and visionaries to<br>
        craft brand identities, digital experiences,<br>
        and narratives that resonate.</p>
      <nav class="nav">
        <a href="#">Work</a><a href="#">Index</a><a href="#">About</a><a href="#">Contact</a>
      </nav>
    </div>

    <h1 class="wordmark">Studioform<span class="wordmark__r">®</span></h1>

    <div class="strip">

      <!-- A — marine froide, silhouette à capuche crème, cadrage portrait -->
      <svg class="ph" viewBox="0 0 300 380" preserveAspectRatio="xMidYMid slice" role="img"
           aria-label="Figure in a cream hood facing the sea">
        <defs>
          <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="s-a-sky-hi"/><stop offset="1" class="s-a-sky-lo"/>
          </linearGradient>
          <linearGradient id="a-sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="s-a-sea-hi"/><stop offset="1" class="s-a-sea-lo"/>
          </linearGradient>
          <linearGradient id="a-cloth" x1="0.15" y1="0" x2="1" y2="0.5">
            <stop offset="0" class="s-a-cloth-hi"/><stop offset="0.5" class="s-a-cloth"/>
            <stop offset="1" class="s-a-cloth-sh"/>
          </linearGradient>
          <radialGradient id="a-glow" cx="0.72" cy="0.34" r="0.6">
            <stop offset="0" class="s-a-sky-hi"/><stop offset="1" class="s-a-glow-out"/>
          </radialGradient>
          <filter id="a-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter>
          <filter id="a-soft"><feGaussianBlur stdDeviation="1.4"/></filter>
          <filter id="a-haze"><feGaussianBlur stdDeviation="6"/></filter>
        </defs>

        <rect width="300" height="380" fill="url(#a-sky)"/>
        <rect y="150" width="300" height="230" fill="url(#a-sea)"/>
        <!-- houle : lignes claires floues, espacées irrégulièrement — jamais un peigne régulier -->
        <g class="a-swell" filter="url(#a-haze)">
          <rect y="166" width="300" height="3"/><rect y="197" width="300" height="5"/>
          <rect y="241" width="300" height="3"/><rect y="298" width="300" height="7"/>
          <rect y="352" width="300" height="4"/>
        </g>
        <rect y="138" width="300" height="34" class="a-horizon-haze" filter="url(#a-haze)"/>

        <!-- la figure : épaules pleine largeur, capuche relevée, profil tourné vers le large.
             Le tissu porte un dégradé : un aplat crème redeviendrait un pictogramme. -->
        <g filter="url(#a-soft)" transform="translate(8 34) scale(0.93)">
          <path d="M62 380 C 68 302 104 258 152 250 C 214 240 262 274 276 336 L 284 380 Z"
                fill="url(#a-cloth)"/>
          <path d="M152 252 C 126 218 134 170 168 154 C 206 136 242 158 246 196
                   C 250 232 228 254 200 258 Z" fill="url(#a-cloth)"/>
          <!-- plis : bord de capuche et retombée d'épaule, en ombre douce -->
          <path d="M168 154 C 150 176 148 216 158 240 C 143 228 134 192 144 170 Z" class="a-fold"/>
          <path d="M206 262 C 224 286 232 322 230 380 L 246 380 C 248 320 238 282 220 258 Z"
                class="a-fold" opacity="0.35"/>
          <!-- profil : front, arête du nez, menton, cou — le visage reste dans l'ombre -->
          <path d="M166 176 C 155 190 153 210 159 224 C 163 234 171 240 179 242
                   L 181 254 L 199 258 L 197 232 C 203 220 202 196 194 184 Z" class="a-skin"/>
          <path d="M159 202 L 150 212 L 160 216 Z" class="a-skin"/>
        </g>
        <rect width="300" height="380" fill="url(#a-glow)" opacity="0.30"
              style="mix-blend-mode: soft-light"/>
        <rect width="300" height="380" filter="url(#a-grain)" opacity="0.11"
              style="mix-blend-mode: overlay"/>
      </svg>

      <!-- B — intérieur chaud, fenêtre de cabine, deux passagères de dos -->
      <svg class="ph" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" role="img"
           aria-label="Two passengers seen from behind through a cabin window">
        <defs>
          <linearGradient id="b-curtain" x1="0" y1="0.1" x2="1" y2="0">
            <stop offset="0" class="s-b-curtain-lo"/><stop offset="0.38" class="s-b-curtain-hi"/>
            <stop offset="0.72" class="s-b-curtain-mid"/><stop offset="1" class="s-b-curtain-lo"/>
          </linearGradient>
          <linearGradient id="b-out" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0" class="s-b-out-hi"/><stop offset="0.62" class="s-b-out-hi"/>
            <stop offset="1" class="s-b-out-lo"/>
          </linearGradient>
          <linearGradient id="b-room" x1="0" y1="0" x2="0.6" y2="1">
            <stop offset="0" class="s-b-wall-hi"/><stop offset="1" class="s-b-wall"/>
          </linearGradient>
          <linearGradient id="b-shirt-g" x1="0" y1="0" x2="0.9" y2="1">
            <stop offset="0" class="s-b-shirt-hi"/><stop offset="1" class="s-b-shirt"/>
          </linearGradient>
          <linearGradient id="b-coat-g" x1="0" y1="0" x2="0.8" y2="1">
            <stop offset="0" class="s-b-coat-hi"/><stop offset="1" class="s-b-coat"/>
          </linearGradient>
          <filter id="b-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter>
          <filter id="b-soft"><feGaussianBlur stdDeviation="1.1"/></filter>
          <filter id="b-glow"><feGaussianBlur stdDeviation="8"/></filter>
        </defs>

        <rect width="300" height="300" fill="url(#b-room)"/>
        <!-- rideau à gauche : c'est lui qui apporte toute la chaleur du cadre -->
        <rect x="0" y="0" width="58" height="300" fill="url(#b-curtain)"/>
        <g class="b-curtain-edge" opacity="0.45">
          <rect x="18" y="0" width="5" height="300"/><rect x="40" y="0" width="7" height="300"/>
          <rect x="52" y="0" width="9" height="300"/>
        </g>

        <!-- la fenêtre : dormant épais, verre, deux loquets sur le rail haut, tablette basse.
             Le jour reste MESURÉ : monté trop haut, le verre brûle et le cadre devient un écran. -->
        <rect x="68" y="28" width="192" height="198" rx="6" class="b-frame"/>
        <rect x="84" y="44" width="160" height="150" rx="2" fill="url(#b-out)"/>
        <rect x="84" y="140" width="160" height="54" class="b-sea"/>
        <ellipse cx="164" cy="104" rx="86" ry="52" class="b-daylight" filter="url(#b-glow)"
                 opacity="0.20"/>
        <rect x="84" y="44" width="160" height="150" fill="none" class="b-glass-edge" stroke-width="2"/>
        <g class="b-frame-hi">
          <rect x="108" y="34" width="30" height="12" rx="3"/>
          <rect x="190" y="34" width="30" height="12" rx="3"/>
          <rect x="68" y="192" width="192" height="16" rx="2"/>
        </g>

        <!-- les deux passagères, de dos, découpées sur le jour de la fenêtre.
             Tailles et hauteurs inégales : deux têtes jumelles feraient deux pictogrammes. -->
        <g filter="url(#b-soft)">
          <path d="M88 300 C 90 252 108 228 138 226 C 168 224 184 248 186 300 Z"
                fill="url(#b-shirt-g)"/>
          <ellipse cx="137" cy="204" rx="26" ry="28" class="b-hair"/>
          <ellipse cx="130" cy="210" rx="21" ry="23" class="b-hair-sh" opacity="0.3"/>
          <path d="M124 186 C 130 178 146 176 152 184 C 146 180 132 181 124 186 Z"
                class="b-hair-hi" opacity="0.6"/>
          <path d="M170 300 C 172 244 194 216 220 216 C 248 216 260 246 260 300 Z"
                fill="url(#b-coat-g)"/>
          <ellipse cx="213" cy="196" rx="28" ry="30" class="b-hair"/>
          <ellipse cx="206" cy="202" rx="22" ry="24" class="b-hair-sh" opacity="0.3"/>
          <path d="M199 176 C 206 168 223 166 230 175 C 223 170 208 171 199 176 Z"
                class="b-hair-hi" opacity="0.6"/>
        </g>
        <rect y="270" width="300" height="30" class="b-seat" opacity="0.75" filter="url(#b-glow)"/>
        <rect width="300" height="300" filter="url(#b-grain)" opacity="0.11"
              style="mix-blend-mode: overlay"/>
      </svg>

      <!-- C — eau verte peu profonde, caustiques, bouée -->
      <svg class="ph" viewBox="0 0 300 330" preserveAspectRatio="xMidYMid slice" role="img"
           aria-label="A life ring floating over shallow green water">
        <defs>
          <linearGradient id="c-water" x1="0.1" y1="0" x2="0.9" y2="1">
            <stop offset="0" class="s-c-water-hi"/><stop offset="0.5" class="s-c-water-mid"/>
            <stop offset="1" class="s-c-water-lo"/>
          </linearGradient>
          <linearGradient id="c-ring-g" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0" class="s-c-ring-hi"/><stop offset="0.55" class="s-c-ring"/>
            <stop offset="1" class="s-c-ring-sh"/>
          </linearGradient>
          <!-- l'irrégularité EST la fonctionnalité : des caustiques régulières redeviennent
               une trame géométrique et l'eau meurt. -->
          <filter id="c-caustics" x="-25%" y="-25%" width="150%" height="150%">
            <feTurbulence type="fractalNoise" baseFrequency="0.010 0.022" numOctaves="4" seed="7"/>
            <feDisplacementMap in="SourceGraphic" scale="58" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="3.2"/>
          </filter>
          <filter id="c-blob" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="9"/>
          </filter>
          <filter id="c-soft"><feGaussianBlur stdDeviation="1.3"/></filter>
          <filter id="c-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter>
        </defs>

        <rect width="300" height="330" fill="url(#c-water)"/>
        <!-- fond : masses sombres diffuses, jamais des cercles nets -->
        <g class="c-bed" filter="url(#c-blob)" opacity="0.5">
          <ellipse cx="64" cy="62" rx="58" ry="36"/>
          <ellipse cx="242" cy="256" rx="64" ry="46"/>
          <ellipse cx="112" cy="306" rx="50" ry="28"/>
          <ellipse cx="268" cy="60" rx="40" ry="30"/>
        </g>
        <g class="c-caustic" filter="url(#c-caustics)" opacity="0.30">
          <path d="M-30 34 H 330 M-30 88 H 330 M-30 146 H 330 M-30 204 H 330 M-30 262 H 330
                   M-30 316 H 330" stroke-width="3" fill="none"/>
          <path d="M-30 60 H 330 M-30 176 H 330 M-30 292 H 330" stroke-width="1.5" fill="none"
                opacity="0.7"/>
        </g>

        <!-- la bouée : anneau blanc, quatre secteurs orange, légèrement tournée.
             L'ombre portée est décalée dans l'eau, pas centrée : c'est elle qui fait flotter. -->
        <g transform="rotate(-18 172 148)">
          <ellipse cx="180" cy="166" rx="76" ry="70" class="c-shadow" opacity="0.32"
                   filter="url(#c-blob)"/>
          <g filter="url(#c-soft)">
            <circle cx="172" cy="148" r="60" fill="none" stroke="url(#c-ring-g)" stroke-width="26"/>
            <circle cx="172" cy="148" r="60" fill="none" class="c-accent" stroke-width="26"
                    stroke-dasharray="25 69" stroke-dashoffset="12"/>
            <circle cx="172" cy="148" r="73" fill="none" class="c-rope" stroke-width="2.5"
                    stroke-dasharray="13 24" opacity="0.7"/>
            <circle cx="172" cy="148" r="47" fill="none" class="c-ring-inner" stroke-width="2"
                    opacity="0.35"/>
          </g>
        </g>
        <rect width="300" height="330" filter="url(#c-grain)" opacity="0.11"
              style="mix-blend-mode: overlay"/>
      </svg>

    </div>
  </div>
</section>

<style>
/* Les arrêts de dégradé et les remplissages SVG passent par des classes : une variable CSS
   dans un attribut de présentation n'est pas garantie partout, une propriété CSS l'est. */
.s-a-sky-hi { stop-color: var(--vl-a-sky-hi); } .s-a-sky-lo { stop-color: var(--vl-a-sky-lo); }
.s-a-sea-hi { stop-color: var(--vl-a-sea-hi); } .s-a-sea-lo { stop-color: var(--vl-a-sea-lo); }
.s-a-cloth-hi { stop-color: var(--vl-a-cloth-hi); }
.s-a-cloth { stop-color: var(--vl-a-cloth); } .s-a-cloth-sh { stop-color: var(--vl-a-cloth-sh); }
.s-a-glow-out { stop-color: var(--vl-a-glow-out); }
.a-swell rect { fill: var(--vl-a-sky-hi); opacity: 0.26; }
.a-horizon-haze { fill: var(--vl-a-sky-hi); opacity: 0.45; }
.a-fold { fill: var(--vl-a-cloth-deep); opacity: 0.5; }
.a-skin { fill: var(--vl-a-skin); }

.s-b-curtain-hi { stop-color: var(--vl-b-curtain-hi); }
.s-b-curtain-mid { stop-color: var(--vl-b-curtain-mid); }
